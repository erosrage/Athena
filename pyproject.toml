[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proj-cli"
version = "0.1.0"
description = "Project lifecycle CLI — scaffold, dev, build, release"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "python-dotenv>=1",
    "atlassian-python-api>=3",
    "boto3>=1.34",
    "azure-keyvault-secrets>=4",
    "azure-identity>=1",
    "requests>=2.31",
    "mcp>=1.0",
    "textual>=0.47",
]

[project.scripts]
proj = "proj.main:app"

[project.optional-dependencies]
dev = ["pytest", "pytest-mock", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["proj"]

[tool.ruff]
line-length = 100
