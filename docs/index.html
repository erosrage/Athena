<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>proj CLI — Workflow Diagram</title>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.5/dist/mermaid.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: #0f1117;
      color: #e2e8f0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      padding: 1.5rem;
      gap: 1rem;
    }
    h1 { font-size: 1.4rem; font-weight: 600; color: #a78bfa; }
    .subtitle { font-size: 0.8rem; color: #64748b; margin-top: 0.15rem; }
    .tabs { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .tab {
      padding: 0.35rem 0.9rem;
      border-radius: 9999px;
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid #334155;
      background: #1e293b;
      color: #94a3b8;
      transition: all 0.15s;
    }
    .tab:hover { border-color: #a78bfa; color: #a78bfa; }
    .tab.active { background: #a78bfa; color: #0f1117; border-color: #a78bfa; }

    .diagram-shell {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 1rem;
      overflow: hidden;
      min-height: 0;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1rem;
      border-bottom: 1px solid #334155;
      flex-shrink: 0;
    }
    .zoom-btn {
      width: 28px; height: 28px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f1117;
      color: #94a3b8;
      font-size: 1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .zoom-btn:hover { border-color: #a78bfa; color: #a78bfa; }
    .zoom-label { font-size: 0.75rem; color: #64748b; min-width: 38px; text-align: center; }
    .spacer { flex: 1; }
    .legend {
      display: flex; gap: 1rem; flex-wrap: wrap; font-size: 0.72rem; color: #64748b;
    }
    .legend-item { display: flex; align-items: center; gap: 0.35rem; }
    .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

    .diagram-viewport {
      flex: 1;
      overflow: auto;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      cursor: grab;
      min-height: 0;
    }
    .diagram-viewport:active { cursor: grabbing; }
    .diagram-scaler {
      transform-origin: top left;
      display: inline-block;
      padding: 1.5rem;
    }
    .diagram-pane { display: none; width: 100%; height: 100%; }
    .diagram-pane.active { display: contents; }

    .error { color: #f87171; font-size: 0.75rem; padding: 1rem; font-family: monospace; }
  </style>
</head>
<body>

<div>
  <h1>proj CLI — Workflow</h1>
  <p class="subtitle">Python-based project lifecycle manager · Windows &amp; macOS</p>
</div>

<div class="tabs">
  <button class="tab active" onclick="show('overview')">Full Overview</button>
  <button class="tab" onclick="show('init')">proj new</button>
  <button class="tab" onclick="show('plan')">proj plan</button>
  <button class="tab" onclick="show('dev')">proj dev</button>
  <button class="tab" onclick="show('build')">proj build</button>
  <button class="tab" onclick="show('release')">proj release</button>
  <button class="tab" onclick="show('status')">proj status</button>
  <button class="tab" onclick="show('help')">proj help</button>
  <button class="tab" onclick="show('claude')">Claude Code</button>
</div>

<div class="diagram-shell">
  <div class="toolbar">
    <button class="zoom-btn" onclick="zoomBy(1.2)" title="Zoom in">+</button>
    <span class="zoom-label" id="zoom-label">100%</span>
    <button class="zoom-btn" onclick="zoomBy(0.8)" title="Zoom out">−</button>
    <button class="zoom-btn" onclick="zoomReset()" title="Reset zoom">⟳</button>
    <div class="spacer"></div>
    <div class="legend" id="legend-overview">
      <div class="legend-item"><div class="dot" style="background:#a78bfa"></div>Entry point</div>
      <div class="legend-item"><div class="dot" style="background:#1e40af"></div>Stage</div>
      <div class="legend-item"><div class="dot" style="background:#475569"></div>Action</div>
      <div class="legend-item"><div class="dot" style="background:#065f46"></div>Claude Code</div>
      <div class="legend-item"><div class="dot" style="background:#0369a1"></div>Jira</div>
      <div class="legend-item"><div class="dot" style="background:#4c1d95"></div>LLM</div>
    </div>
    <div class="legend" id="legend-claude" style="display:none">
      <div class="legend-item"><div class="dot" style="background:#065f46"></div>Claude Code</div>
      <div class="legend-item"><div class="dot" style="background:#0f4c75"></div>Slash command</div>
      <div class="legend-item"><div class="dot" style="background:#3b0764"></div>MCP tool</div>
      <div class="legend-item"><div class="dot" style="background:#a78bfa"></div>CLI call</div>
    </div>
  </div>

  <div class="diagram-viewport" id="viewport">
    <div class="diagram-scaler" id="scaler">
      <div class="diagram-pane active" id="pane-overview"><div id="svg-overview"></div></div>
      <div class="diagram-pane" id="pane-init"><div id="svg-init"></div></div>
      <div class="diagram-pane" id="pane-plan"><div id="svg-plan"></div></div>
      <div class="diagram-pane" id="pane-dev"><div id="svg-dev"></div></div>
      <div class="diagram-pane" id="pane-build"><div id="svg-build"></div></div>
      <div class="diagram-pane" id="pane-release"><div id="svg-release"></div></div>
      <div class="diagram-pane" id="pane-status"><div id="svg-status"></div></div>
      <div class="diagram-pane" id="pane-help"><div id="svg-help"></div></div>
      <div class="diagram-pane" id="pane-claude"><div id="svg-claude"></div></div>
    </div>
  </div>
</div>

  // ── Zoom state ──────────────────────────────────────────────
  let scale = 1;

  function updateZoomLabel() {
    document.getElementById('zoom-label').textContent = Math.round(scale * 100) + '%';
  }

  function applyScale() {
    document.getElementById('scaler').style.transform = `scale(${scale})`;
    updateZoomLabel();
  }

  function zoomBy(factor) {
    scale = Math.min(Math.max(scale * factor, 0.2), 4);
    applyScale();
  }

  function zoomReset() {
    scale = 1;
    applyScale();
    const vp = document.getElementById('viewport');
    vp.scrollTop = 0;
    vp.scrollLeft = 0;
  }

  // scroll-wheel zoom on viewport
  document.getElementById('viewport').addEventListener('wheel', e => {
    if (e.ctrlKey || e.metaKey) {
      e.preventDefault();
      zoomBy(e.deltaY < 0 ? 1.1 : 0.9);
    }
  }, { passive: false });

  // ── Pan via drag ─────────────────────────────────────────────
  const vp = document.getElementById('viewport');
  let drag = false, dragX = 0, dragY = 0;
  vp.addEventListener('mousedown', e => {
    drag = true; dragX = e.clientX + vp.scrollLeft; dragY = e.clientY + vp.scrollTop;
  });
  window.addEventListener('mousemove', e => {
    if (!drag) return;
    vp.scrollLeft = dragX - e.clientX;
    vp.scrollTop  = dragY - e.clientY;
  });
  window.addEventListener('mouseup', () => drag = false);

  // ── Render ───────────────────────────────────────────────────
  const rendered = new Set();
  const TABS = ['overview','init','plan','dev','build','release','status','help','claude'];

  async function renderDiagram(id) {
    if (rendered.has(id)) return;
    const el = document.getElementById('svg-' + id);
    if (!el) return;
    try {
      const { svg } = await mermaid.render('m-' + id, diagrams[id]);
      el.innerHTML = svg;
      rendered.add(id);
    } catch (e) {
      el.innerHTML = `<div class="error">${e.message}</div>`;
    }
  }

  function show(id) {
    TABS.forEach(t => {
      document.getElementById('pane-' + t).classList.toggle('active', t === id);
      document.querySelectorAll('.tab')[TABS.indexOf(t)].classList.toggle('active', t === id);
    });
    document.getElementById('legend-overview').style.display = (id === 'overview') ? '' : 'none';
    document.getElementById('legend-claude').style.display   = (id === 'claude')   ? '' : 'none';
    zoomReset();
    renderDiagram(id);
  }

  renderDiagram('overview');
</script>
</body>
</html>
